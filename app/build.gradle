plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x96.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.x96.launcher'
        minSdk 21
        // 29 = Android 10 (как на приставке): без ограничений видимости пакетов
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // подпись отладочным ключом: для установки на свою приставку этого достаточно
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
